name: Release

# Push a tag like v1.0.1 to build an ad-hoc signed (not notarized) DMG and
# publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app (ad-hoc signed)
        run: ./make-app.sh
      - name: Build DMG
        run: ./scripts/make-dmg.sh "${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "MacSweep-${GITHUB_REF_NAME#v}.dmg" \
            --title "MacSweep ${GITHUB_REF_NAME#v}" --generate-notes \
            --notes "Not notarized: on first launch, right-click MacSweep.app, choose Open, then Open again."
